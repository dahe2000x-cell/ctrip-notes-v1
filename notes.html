<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>携程笔记 · 今日发布</title>
<style>
:root{--bg:#fff;--bg2:#f8f9fa;--bg3:#f0f1f3;--text:#1a1a2e;--t2:#6b7280;--t3:#9ca3af;--bdr:#e5e7eb;--pr:#7F77DD;--prl:#EEEDFE;--prd:#3C3489;--gn:#1D9E75;--gnl:#E1F5EE;--rd:#E24B4A;--rdl:#FCEBEB;--am:#BA7517;--aml:#FAEEDA;--r:8px;--rl:12px;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg2);color:var(--text);font-size:14px;line-height:1.7;padding-bottom:40px}
.topbar{background:var(--bg);border-bottom:1px solid var(--bdr);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:15px;font-weight:500;color:var(--prd)}
.topbar .date{font-size:11px;color:var(--t3)}
.post{background:var(--bg);margin:12px;border-radius:var(--rl);border:1px solid var(--bdr);overflow:hidden}
.post.key{border-color:var(--pr);border-width:1.5px}
.post-header{padding:14px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.post-header .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;font-weight:500}
.tag-s{background:var(--rdl);color:var(--rd)}.tag-a{background:var(--aml);color:var(--am)}.tag-b{background:#E6F1FB;color:#378ADD}.tag-k{background:var(--prl);color:var(--prd)}
.post-body{padding:16px}
.post-body .img-title{font-size:16px;font-weight:500;color:var(--text);margin-bottom:4px;border-left:3px solid var(--pr);padding-left:10px}
.post-body .body-title{font-size:14px;color:var(--t2);margin-bottom:12px}
.post-body .content{font-size:14px;white-space:pre-wrap;word-break:break-word}
.post-body .tags{font-size:11px;color:var(--t3);margin-top:12px;padding-top:10px;border-top:1px solid var(--bdr)}
.post-btns{padding:10px 16px;border-top:1px solid var(--bdr);display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500;transition:all .15s}
.btn-p{background:var(--pr);color:#fff}.btn-p:hover{opacity:.9}
.btn-g{background:var(--gn);color:#fff}.btn-g:hover{opacity:.9}
.btn-o{background:var(--bg);border:1px solid var(--bdr);color:var(--text)}
.btn-w{background:var(--rd);color:#fff}.btn-w:hover{opacity:.9}
.copy-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--prd);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s}
.fix-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.fix-modal.show{opacity:1;pointer-events:auto}
.fix-card{background:var(--bg);border-radius:var(--rl);width:90%;max-width:360px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.fix-card h3{font-size:15px;margin-bottom:12px}
.fix-card .issue-btn{display:block;width:100%;padding:10px 14px;margin-bottom:8px;border:1px solid var(--bdr);border-radius:var(--r);background:var(--bg);font-size:13px;text-align:left;cursor:pointer;transition:all .15s}
.fix-card .issue-btn:active{background:var(--bg3)}
.quick-fix{display:none;padding:8px 14px;border-top:1px solid var(--bdr);background:var(--bg2)}
.quick-fix.show{display:block}
.quick-fix .qf-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.quick-fix .qf-row:last-child{margin-bottom:0}
.quick-fix input{flex:1;padding:6px 8px;border:1px solid var(--bdr);border-radius:6px;font-size:13px}
.quick-fix .qf-btn{padding:6px 10px;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:500}
.quick-fix .qf-save{background:var(--gn);color:#fff}
.quick-fix .qf-done{color:var(--gn);font-size:12px;font-weight:500}
.copy-toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--t3)}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}.empty .em{font-size:48px;margin-bottom:12px}
.nav-tabs{display:flex;gap:0;border-bottom:1px solid var(--bdr);margin:0 12px;overflow-x:auto}
.nav-tab{flex:1;min-width:70px;padding:12px 8px;text-align:center;border:none;background:none;font-size:11px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-tab.active{color:var(--prd);border-bottom-color:var(--pr);font-weight:500}
.img-section{background:var(--bg2);border-radius:var(--r);padding:12px;margin-top:12px}
.img-section h3{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--t2)}
.cover-rec{background:var(--prl);border-radius:var(--r);padding:8px 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cover-rec .cicon{font-size:20px}.cover-rec .cinfo{font-size:11px;line-height:1.4}
.img-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px;border-bottom:1px solid var(--bdr)}
.img-row:last-child{border-bottom:none}
.img-row .inum{color:var(--t3);min-width:20px;font-size:10px}.img-row .iscene{color:var(--t2);font-size:10px}
.missing{background:var(--rdl);border-radius:var(--r);padding:8px 10px;margin-top:6px;font-size:11px;color:var(--rd);line-height:1.5}
.stat-hint{background:var(--aml);border-radius:var(--r);padding:6px 10px;margin-top:6px;font-size:10px;color:var(--am)}
</style>
</head>
<body>

<div class="topbar">
  <h1>携程笔记 · 今日发布</h1>
  <div style="display:flex;align-items:center;gap:6px">
    <button onclick="prevDay()" style="border:none;background:none;font-size:16px;cursor:pointer;padding:4px;color:var(--t2)">◀</button>
    <span class="date" id="dateLabel"></span>
    <button onclick="nextDay()" style="border:none;background:none;font-size:16px;cursor:pointer;padding:4px;color:var(--t2)">▶</button>
    <button onclick="goToday()" style="border:none;background:var(--prl);color:var(--prd);font-size:11px;padding:4px 8px;border-radius:var(--r);cursor:pointer">今天</button>
  </div>
</div>

<div class="nav-tabs" id="navTabs"></div>
<div id="content"></div>
<div class="copy-toast" id="toast">已复制到剪贴板</div>
<div class="fix-modal" id="fixModal">
  <div class="fix-card">
    <h3>🔧 这篇笔记有什么问题？</h3>
    <div id="fixOptions"></div>
    <button class="btn btn-o" style="width:100%;margin-top:6px" onclick="closeFixModal()">取消</button>
  </div>
</div>

<script>
let notes=[],curTab=0,curDate='';
function dateStr(d){return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function fmtDate(s){return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)}
async function load(ds){
  curDate=ds||dateStr(new Date());
  let file='notes_'+curDate+'.json';
  try{let r=await fetch(file);notes=await r.json()}catch(e){
    try{let r2=await fetch('today_notes.json');notes=await r2.json()}catch(e2){notes=[]}
  }
  if(notes.length===0){
    document.getElementById('dateLabel').textContent=fmtDate(curDate);
    document.getElementById('navTabs').innerHTML='';
    document.getElementById('content').innerHTML='<div class="empty"><div class="em">📭</div><p>'+fmtDate(curDate)+' 还没有笔记</p><p style="font-size:12px;color:var(--t3);margin-top:4px">每天8:00自动生成</p></div>';
    return}
  document.getElementById('dateLabel').textContent=fmtDate(curDate);
  document.getElementById('navTabs').innerHTML=notes.map((n,i)=>`<button class="nav-tab ${i===0?'active':''}" onclick="switchPost(${i})">${n.account}·第${n.idx}篇${n.strength==='S'?'⭐':''}</button>`).join('');
  renderPost(0)}
function prevDay(){if(!curDate)curDate=dateStr(new Date());var y=parseInt(curDate.slice(0,4)),m=parseInt(curDate.slice(4,6))-1,d=parseInt(curDate.slice(6,8));var dt=new Date(y,m,d);dt.setDate(dt.getDate()-1);load(dateStr(dt))}
function nextDay(){if(!curDate)curDate=dateStr(new Date());var y=parseInt(curDate.slice(0,4)),m=parseInt(curDate.slice(4,6))-1,d=parseInt(curDate.slice(6,8));var dt=new Date(y,m,d);dt.setDate(dt.getDate()+1);load(dateStr(dt))}
function goToday(){load(dateStr(new Date()))}
function switchPost(i){curTab=i;document.querySelectorAll('.nav-tab').forEach((b,j)=>b.classList.toggle('active',j===i));renderPost(i);window.scrollTo(0,0)}
function renderPost(i){
  let n=notes[i],key=n.strength==='S',strengthClass=n.strength==='S'?'tag-s':(n.strength==='A'?'tag-a':'tag-b');
  let cover=n.coverImage,imgs=n.imageList||[],missing=n.missingImages||[],needs=n.imageNeeds||'';
  let imgHTML='';
  if(cover||imgs.length>0||missing.length>0){
    imgHTML='<div class="img-section"><h3>📷 配图清单</h3>';
    if(cover)imgHTML+=`<div class="cover-rec"><div class="cicon">🖼️</div><div class="cinfo"><b>封面推荐:</b> ${cover.filename}<br><span style="color:var(--t2)">${cover.scene||''} · ${cover.quality||''}· 适合封面</span></div></div>`;
    if(imgs.length>0)imgHTML+=imgs.map((im,j)=>`<div class="img-row"><span class="inum">${j+1}.</span><span>${im.filename}</span><span class="iscene">${im.scene||''} · ${im.usage||''}</span></div>`).join('');
    if(missing.length>0)imgHTML+=missing.map(m=>`<div class="missing">⚠️ ${m}</div>`).join('');
    if(needs&&missing.length>0)imgHTML+=`<div class="stat-hint">💡 本篇图片需求: ${needs}<br>添加到素材库后下次自动匹配</div>`;
    imgHTML+='</div>';
  }
  document.getElementById('content').innerHTML=`
    <div class="post ${key?'key':''}">
      <div class="post-header">
        <div class="left"><span style="font-weight:500">${n.account} · 第${n.idx}篇</span><span class="tag ${strengthClass}">${n.strength}级</span><span style="font-size:11px;color:var(--t2)">${n.city}</span>${key?'<span class="tag tag-k">重点</span>':''}</div>
        <span style="font-size:10px;color:var(--t3)">约${n.words}字</span>
      </div>
      <div class="post-body">
        <div class="img-title">${n.imageTitle||''}</div>
        <div class="body-title">${n.bodyTitle||''}</div>
        <div class="content">${n.body||''}</div>
        ${imgHTML}
        <div class="tags">${n.tags||''}</div>
      </div>
      <div class="post-btns">
        <button class="btn btn-p" onclick="copyField(${i},'imageTitle')">复制图片标题</button>
        <button class="btn btn-g" onclick="copyField(${i},'body')">复制正文</button>
        <button class="btn btn-o" onclick="copyField(${i},'tags')">复制标签</button>
        ${imgs.length>0?`<button class="btn btn-o" onclick="copyImgList(${i})">复制配图</button>`:''}
        <button class="btn btn-w" onclick="toggleQuickFix(${i})">🔧 快速修改</button>
        <button class="btn btn-o" onclick="openFixModal(${i})" style="font-size:11px">📋 请求AI</button>
      </div>
      <div class="quick-fix" id="qf${i}">
        <div class="qf-row">
          <input id="qfCity${i}" placeholder="新城市名" value="${n.city||''}">
          <button class="qf-btn qf-save" onclick="doQuickFix(${i},'city')">换城市</button>
        </div>
        <div class="qf-row">
          <input id="qfImgTitle${i}" placeholder="图片标题">
          <button class="qf-btn qf-save" onclick="doQuickFix(${i},'imageTitle')">改图片标题</button>
        </div>
        <div class="qf-row">
          <input id="qfBodyTitle${i}" placeholder="正文标题">
          <button class="qf-btn qf-save" onclick="doQuickFix(${i},'bodyTitle')">改正文标题</button>
        </div>
        <div id="qfStatus${i}" style="font-size:11px;margin-top:4px"></div>
      </div>
    </div>`}
function copyField(i,field){
  let text=notes[i][field]||'';navigator.clipboard.writeText(text).then(()=>{let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}).catch(()=>alert('复制失败'))}
function copyImgList(i){
  let n=notes[i],lines=[],cover=n.coverImage,imgs=n.imageList||[];
  if(cover)lines.push('【封面】'+cover.filename);
  imgs.forEach((im,j)=>lines.push((j+1)+'. '+im.filename+' ['+(im.scene||'')+']'));
  navigator.clipboard.writeText(lines.join('\n')).then(()=>{let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}).catch(()=>alert('复制失败'))}
function openFixModal(i){
  let n=notes[i],date=fmtDate(curDate);
  let issues=[
    {label:'字数不够，需要扩展',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，字���不够，需要扩展到1800字左右`},
    {label:'字数太多，需要删减',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，字数超标，需要删到1800字左右`},
    {label:'城市重复了，需要换城市',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，这个城市7天内重复了，需要换成其他城市`},
    {label:'内容结构不完整',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，住宿/吃/路线/避坑内容太敷衍，需要按规范重新写完整`},
    {label:'图片标题需要修改',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，图片标题需要修改`},
    {label:'正文标题需要修改',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，正文标题需要修改`},
    {label:'其他问题（请补充）',cmd:`修改 ${date} 第${n.idx}篇 ${n.city}，`}
  ];
  document.getElementById('fixOptions').innerHTML=issues.map((v,j)=>`<button class="issue-btn" onclick="doFix(${j},${i})"><b>${j+1}.</b> ${v.label}</button>`).join('');
  document.getElementById('fixModal').classList.add('show');
  window._fixIssues=issues;window._fixIdx=i}
function doFix(j,i){
  let n=notes[i],issue=window._fixIssues[j];
  let body={date:curDate,idx:n.idx,city:n.city,account:n.account,issue:issue.label};
  navigator.clipboard.writeText(issue.cmd); // backup: also copy
  fetch('/api/request-fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      closeFixModal();
      let t=document.getElementById('toast');t.textContent=d.ok?'✅ 已提交！AI马上处理':'⚠️ '+d.error;t.classList.add('show');setTimeout(()=>{t.classList.remove('show');t.textContent='已复制到剪贴板'},3000)
    }).catch(e=>{
      closeFixModal();
      let t=document.getElementById('toast');t.textContent='指令已复制，到WorkBuddy粘贴发送';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)
    })}
function closeFixModal(){document.getElementById('fixModal').classList.remove('show')}
function toggleQuickFix(i){
  let el=document.getElementById('qf'+i);
  if(el.classList.contains('show')){el.classList.remove('show');return}
  document.querySelectorAll('.quick-fix').forEach(q=>q.classList.remove('show'));
  el.classList.add('show');
  // fill current values
  let n=notes[i];
  document.getElementById('qfCity'+i).value=n.city||'';
  document.getElementById('qfImgTitle'+i).value=n.imageTitle||'';
  document.getElementById('qfBodyTitle'+i).value=n.bodyTitle||'';
}
async function doQuickFix(i,field){
  let n=notes[i],st=document.getElementById('qfStatus'+i);
  let inputId='qf'+(field==='city'?'City':field==='imageTitle'?'ImgTitle':'BodyTitle')+i;
  let val=document.getElementById(inputId).value.trim();
  if(!val){st.textContent='⚠️ 不能为空';return}
  if(val===n[field]){st.textContent='✅ 没有变化';return}
  st.textContent='⏳ 修改中...';
  try{
    let resp=await fetch('/api/fix-note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:curDate,idx:n.idx,field:field,value:val})});
    let data=await resp.json();
    if(data.ok){
      n[field]=val;
      renderPost(i);
      st.textContent='✅ 已修改！'+(data.words?' 字数:'+data.words:'');
    }else{
      st.textContent='❌ '+data.error;
    }
  }catch(e){
    st.textContent='❌ 服务器未连接（需要电脑端运行 server.py）';
  }
}
window.onload=load;
</script>
</body>
</html>
