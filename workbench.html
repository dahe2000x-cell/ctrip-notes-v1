<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>携程笔记 · AI工作台</title>
<style>
:root{--bg:#fafbfc;--card:#fff;--text:#1d1d2c;--t2:#5f6b7a;--t3:#9aa3b0;--bdr:#e8ecf1;--pr:#6c5ce7;--prl:#f0edfd;--prd:#4a3db5;--gn:#00b894;--gnl:#e6f9f2;--rd:#e17055;--rdl:#fdf0ec;--am:#f39c12;--aml:#fef6e8;--bl:#0984e3;--bll:#e8f4fd;--r:10px;--rl:14px;--sh:0 2px 12px rgba(0,0,0,.06);--f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--bdr);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:50}
.sidebar .logo{font-size:16px;font-weight:700;color:var(--prd);margin-bottom:28px;letter-spacing:-.3px}
.sidebar .logo span{color:var(--pr);font-size:18px;margin-right:4px}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--t2);border-radius:var(--r);margin-bottom:4px;transition:all .2s;width:100%;text-align:left}
.sidebar .nav-item:hover{background:var(--bg);color:var(--text)}
.sidebar .nav-item.active{background:var(--prl);color:var(--prd);font-weight:600}
.sidebar .nav-item .nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar .nav-item .badge{background:var(--pr);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:auto}
.sidebar .divider{height:1px;background:var(--bdr);margin:16px 0}
.sidebar .nav-sub{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;padding:8px 14px 4px;margin-top:8px}
.sidebar .status{font-size:11px;color:var(--t3);padding:8px 14px;margin-top:auto}
.main{flex:1;padding:24px 32px;overflow-y:auto;max-width:1200px}
.header2{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header2 h2{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header2 .actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--rl);border:1px solid var(--bdr);padding:20px;margin-bottom:16px;box-shadow:var(--sh);transition:all .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.tc{background:var(--card);border-radius:var(--rl);border:1px solid var(--bdr);overflow:hidden;box-shadow:var(--sh);transition:all .2s}
.tc:hover{box-shadow:0 4px 20px rgba(0,0,0,.1);transform:translateY(-1px)}
.tc.key{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr),0 4px 16px rgba(108,92,231,.15)}
.tc-top{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);background:linear-gradient(135deg,#fafbfc 0%,#f5f6f8 100%)}
.tc-body{padding:14px 18px}
.tc-body .fl{margin-bottom:8px}.tc-body .fl:last-child{margin-bottom:0}
.tc-body .fn{font-size:10px;color:var(--t3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.tc-body .fv{font-size:12.5px;word-break:break-all}.tc-body .fe{color:var(--t3);font-style:italic}
.tc-act{padding:14px 18px;border-top:1px solid var(--bdr);display:flex;gap:6px;flex-wrap:wrap;background:var(--bg)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.col{flex:1;min-width:180px}
label{display:block;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:600;letter-spacing:.2px}
input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:12.5px;font-family:var(--f);background:var(--bg);color:var(--text);transition:all .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--prl);background:var(--card)}
textarea{resize:vertical;min-height:60px}
.btn{padding:9px 16px;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:600;transition:all .2s;white-space:nowrap;letter-spacing:.2px}
.btn-p{background:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(108,92,231,.3)}.btn-p:hover{background:var(--prd);transform:translateY(-1px)}
.btn-g{background:var(--gn);color:#fff;box-shadow:0 2px 8px rgba(0,184,148,.3)}.btn-g:hover{opacity:.9;transform:translateY(-1px)}
.btn-r{background:var(--rd);color:#fff}.btn-r:hover{opacity:.9}
.btn-o{background:var(--card);border:1.5px solid var(--bdr);color:var(--text)}.btn-o:hover{background:var(--bg);border-color:var(--t3)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-xs{padding:4px 8px;font-size:10px}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
.tag-s{background:var(--rdl);color:var(--rd)}.tag-a{background:var(--aml);color:var(--am)}.tag-b{background:var(--bll);color:var(--bl)}
.tag-ok{background:var(--gnl);color:var(--gn)}.tag-d{background:var(--bg);color:var(--t2)}.tag-k{background:var(--prl);color:var(--prd)}
.filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter select,.filter input{width:auto;min-width:100px}
.alert{padding:12px 16px;border-radius:var(--r);font-size:12px;margin-bottom:14px;border-left:3px solid transparent}
.ai{border-left-color:var(--bl);background:var(--bll);color:var(--bl)}.aw{border-left-color:var(--am);background:var(--aml);color:var(--am)}.aok{border-left-color:var(--gn);background:var(--gnl);color:var(--gn)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:var(--rl);width:92%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.mh{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.mb{padding:18px 20px}
.empty{text-align:center;padding:48px;color:var(--t3)}.empty .em{font-size:40px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ic{background:var(--card);border:1.5px solid var(--bdr);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.ic:hover{border-color:var(--pr);transform:translateY(-2px)}.ic.sel{border-color:var(--pr);border-width:2px;background:var(--prl)}
.ip{height:90px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:10px;overflow:hidden}
.ip img{width:100%;height:100%;object-fit:cover}
.ii{padding:6px 8px}.ii .nm{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ii .mt{font-size:9px;color:var(--t3)}
hr{border:none;border-top:1px solid var(--bdr);margin:16px 0}
.pkg{background:var(--bg);border-radius:var(--rl);padding:18px;font-family:'SF Mono',Monaco,monospace;font-size:11px;line-height:1.8;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bdr);font-size:12px}
th{background:var(--bg);font-weight:600;color:var(--t2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:var(--prl);transition:background .15s}
.progress-bar{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-top:5px}.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--pr),var(--prd));border-radius:3px;transition:width .3s}
.tip{font-size:10.5px;color:var(--t3);margin-top:4px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.status-dot.online{background:var(--gn)}.status-dot.offline{background:var(--rd)}
@media(max-width:768px){body{flex-direction:column}.sidebar{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px;position:sticky;top:0;gap:4px}.sidebar .logo{width:100%;margin-bottom:8px}.sidebar .nav-item{width:auto;flex-shrink:0;padding:7px 12px;font-size:12px}.sidebar .nav-sub,.sidebar .divider,.sidebar .status{display:none}.main{padding:16px}}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><span>✦</span>携程笔记</div>
  <button class="nav-item active" onclick="switchTab('tasks')"><span class="nav-icon">📋</span>今日任务<span class="badge" id="taskBadge">4</span></button>
  <button class="nav-item" onclick="switchTab('topics')"><span class="nav-icon">📝</span>选题库<span class="badge" id="topicBadge">0</span></button>
  <button class="nav-item" onclick="switchTab('images')"><span class="nav-icon">🖼️</span>素材库<span class="badge" id="imageBadge">0</span></button>
  <div class="divider"></div>
  <div class="nav-sub">快捷操作</div>
  <a href="notes.html" class="nav-item" style="text-decoration:none"><span class="nav-icon">📱</span>笔记发布</a>
  <button class="nav-item" onclick="loadFromServer().then(()=>{renderTopics();renderImages()})"><span class="nav-icon">📥</span>刷新数据</button>
  <div class="status"><span class="status-dot online"></span><span id="statusBar">在线</span></div>
</div>

<div class="main">

<div id="tab-tasks">
  <div class="header2">
    <h2>今日任务 <span style="font-weight:400;font-size:13px;color:var(--t3);margin-left:6px" id="dateDisplay"></span></h2>
    <div class="actions">
      <span style="font-size:12px;color:var(--t2);align-self:center" id="progressText"></span>
      <button class="btn btn-o btn-sm" onclick="resetToday()">重置</button>
      <button class="btn btn-p btn-sm" onclick="smartRecommend()">🧠 智能推荐</button>
    </div>
  </div>
  <div id="alertBox"></div>
  <div class="task-grid" id="taskGrid"></div>
</div>

<div id="tab-topics" style="display:none">
  <div class="header2">
    <h2>选题库</h2>
    <div class="actions">
      <button class="btn btn-o btn-sm" onclick="loadFromServer().then(()=>{renderTopics();renderImages()})">📥 从服务器加载</button>
      <button class="btn btn-sm" onclick="syncTopics()" style="background:var(--aml);color:var(--am);border:none">🔄 同步</button>
      <button class="btn btn-sm" onclick="scoreAllTopics()" style="background:var(--bll);color:var(--bl);border:none">📊 一键评分</button>
      <button class="btn btn-p btn-sm" onclick="openTopicForm()">+ 新增</button>
    </div>
  </div>
  <div class="filter">
    <select id="tfCity" onchange="renderTopics()"><option value="">全部城市</option></select>
    <select id="tfStatus" onchange="renderTopics()"><option value="">全部状态</option><option value="未用">未用</option><option value="已用">已用</option></select>
    <select id="tfStrength" onchange="renderTopics()"><option value="">全部强度</option><option value="S">S级</option><option value="A">A级</option><option value="B">B级</option></select>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table><thead><tr><th>城市</th><th>公式</th><th>图片标题</th><th>评分</th><th>人群</th><th>天气</th><th>冷却</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="topicTable"></tbody></table>
    <div class="empty" id="topicEmpty"><div class="em">📝</div><p>还没有选题</p></div>
  </div>
</div>

<div id="tab-images" style="display:none">
  <div class="header2">
    <h2>素材库</h2>
    <div class="actions">
      <button class="btn btn-o btn-sm" onclick="openImageBatchForm()">批量导入</button>
      <button class="btn btn-p btn-sm" onclick="openImageForm()">+ 添加</button>
    </div>
  </div>
  <div class="filter">
    <select id="ifCity" onchange="renderImages()"><option value="">全部城市</option></select>
    <select id="ifScene" onchange="renderImages()"><option value="">全部场景</option></select>
    <input type="text" id="ifSearch" placeholder="搜索..." oninput="renderImages()" style="width:150px">
  </div>
  <div class="grid3" id="imageGrid"></div>
  <div class="empty" id="imageEmpty"><div class="em">🖼️</div><p>还没有图片</p></div>
</div>
</div>

<div id="topicFormModal" class="modal-bg" style="display:none"><div class="modal"><div class="mh"><h3 id="tfTitle">新增选题</h3><button class="btn btn-o btn-sm" onclick="closeTopicForm()">✕</button></div><div class="mb" id="tfBody"></div></div></div>
<div id="imageFormModal" class="modal-bg" style="display:none"><div class="modal"><div class="mh"><h3 id="ifTitle">添加图片</h3><button class="btn btn-o btn-sm" onclick="closeImageForm()">✕</button></div><div class="mb" id="ifBody"></div></div></div>
<div id="imageSelModal" class="modal-bg" style="display:none"><div class="modal"><div class="mh"><h3>选择图片</h3><button class="btn btn-o btn-sm" onclick="closeImgSel()">✕</button></div><div class="mb"><div id="imgSelContent"></div></div></div></div>
<div id="topicSelModal" class="modal-bg" style="display:none"><div class="modal"><div class="mh"><h3>选择选题</h3><button class="btn btn-o btn-sm" onclick="closeTopicSel()">✕</button></div><div class="mb"><div id="topicSelContent"></div></div></div></div>
<div id="publishModal" class="modal-bg" style="display:none"><div class="modal" style="max-width:800px"><div class="mh"><h3>发布包</h3><div style="display:flex;gap:6px"><button class="btn btn-g btn-sm" onclick="copyPkg()">复制全部</button><button class="btn btn-o btn-sm" onclick="closePublish()">关闭</button></div></div><div class="mb" id="publishContent"></div></div></div>
<div id="scanModal" class="modal-bg" style="display:none"><div class="modal"><div class="mh"><h3>合规扫描结果</h3><button class="btn btn-o btn-sm" onclick="closeScan()">关闭</button></div><div class="mb" id="scanContent"></div></div></div>
<div id="smartModal" class="modal-bg" style="display:none"><div class="modal" style="max-width:800px"><div class="mh"><h3>智能推荐结果</h3><div style="display:flex;gap:6px"><button class="btn btn-p btn-sm" onclick="applySmartRec()">应用推荐</button><button class="btn btn-o btn-sm" onclick="closeSmart()">关闭</button></div></div><div class="mb" id="smartContent"></div></div></div>

<script>
const K={T:'wb_tasks',TP:'wb_topics',IM:'wb_images'};
function L(k){try{return JSON.parse(localStorage.getItem(k)||(k===K.T?'{}':'[]'))}catch(e){return k===K.T?{}:[]}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function U(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function D(){return new Date().toISOString().slice(0,10)}
function daysAgo(d){if(!d)return 999;return Math.floor((new Date()-new Date(d))/(86400000))}
let curTab='tasks',curTask=-1,curImgSel=null,curTopicSel=null,edTP=null,edIM=null,smartRec=null;

const cityTiers={S:['成都','西安','厦门','青岛','昆明','哈尔滨','重庆','珠海','深圳'],A:['北京','上海','广州','杭州','南京','武汉','长沙','天津','大连','苏州','贵阳','兰州','沈阳','济南'],small:['清远','中山','南宁','柳州']};
function cityScore(c){if(cityTiers.S.includes(c))return 5;if(cityTiers.A.includes(c))return 4;if(cityTiers.small.includes(c))return 3;return 1}
const seasonCities={summer:['昆明','哈尔滨','青岛','大连','贵阳','六盘水','恩施']};
function seasonScore(c){let m=new Date().getMonth()+1;if(m>=6&&m<=8){if(seasonCities.summer.includes(c))return 5;return 3}return 3}

function scoreTopic(tp){
  let s=0;
  s+=cityScore(tp.city||'');
  s+=seasonScore(tp.city||'');
  s+=(tp.formula==='S级')?5:(tp.formula==='A级')?3:1;
  s+=(tp.targetAudience||'').length>0?3:1;
  s+=((tp.imageTitle||'').includes('｜'))?4:1;
  s+=((tp.moneyAngle||'').length>0)?4:1;
  if(tp.weatherRisk==='红')s-=5;else if(tp.weatherRisk==='黄')s-=2;
  let risk=0;['伪亲历','海岛','漂流','宗教'].forEach(k=>{if((tp.mustNotWrite||'').includes(k))risk--});s+=risk;
  let days=daysAgo(tp.usedDate);if(days<7)s-=3;else if(days<14)s-=1;
  if((tp.imageNeeds||'').length>10)s+=2;
  return Math.max(0,Math.min(50,s));
}

function coolStatus(tp){
  let msgs=[];
  let days=daysAgo(tp.usedDate);
  if(tp.status==='已用'&&days<3){msgs.push('⚠️3天内用过');return{msg:msgs.join(', '),blocked:true}}
  if(tp.status==='已用'&&days<7)msgs.push('7天内用过');
  if(tp.status==='已用'&&days<14)msgs.push('冷却中');
  return{msg:msgs.join(', ')||'✓',blocked:false};
}

function getTasks(){
  let t=L(K.T);if(!t[D()]){t[D()]=[
    {id:U(),idx:1,account:'林姐',strength:'B/A',city:'',formula:'',imageTitle:'',bodyTitle:'',coverImg:'',imgs:[],publishStatus:'',publishTime:'',topicId:'',notes:''},
    {id:U(),idx:2,account:'叮咚',strength:'B',city:'',formula:'',imageTitle:'',bodyTitle:'',coverImg:'',imgs:[],publishStatus:'',publishTime:'',topicId:'',notes:''},
    {id:U(),idx:3,account:'叮咚',strength:'A',city:'',formula:'',imageTitle:'',bodyTitle:'',coverImg:'',imgs:[],publishStatus:'',publishTime:'',topicId:'',notes:''},
    {id:U(),idx:4,account:'叮咚',strength:'S',city:'',formula:'',imageTitle:'',bodyTitle:'',coverImg:'',imgs:[],publishStatus:'',publishTime:'',topicId:'',notes:''}
  ];S(K.T,t)}return t[D()]}

function saveTask(idx,fd,val){
  let t=L(K.T);t[D()][idx][fd]=val;S(K.T,t);renderTasks()}

function renderTasks(){
  let day=getTasks(),done=day.filter(t=>t.publishStatus==='已发布').length;
  document.getElementById('taskBadge').textContent=(4-done)||'✓';
  document.getElementById('dateDisplay').textContent=D();
  document.getElementById('progressText').textContent='已完成 '+done+'/4';
  let ab=document.getElementById('alertBox'),h=new Date().getHours();
  if(done===4){ab.innerHTML='<div class="alert aok">✓ 今日4篇已全部发布</div>'}else if(h>=11){ab.innerHTML='<div class="alert aw">⏰ 距12:00还有'+(12-h)+'小时，还剩'+(4-done)+'篇</div>'}else{ab.innerHTML=''}
  document.getElementById('taskGrid').innerHTML=day.map((t,i)=>`
    <div class="tc ${t.idx===4?'key':''}">
      <div class="tc-top">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-weight:500">第${t.idx}篇</span>
          <span class="tag tag-${t.strength==='S'?'s':(t.strength==='A'?'a':'b')}">${t.strength}级</span>
          <span style="font-size:11px;color:var(--t2)">${t.account}</span>
          ${t.idx===4?'<span class="tag tag-k">重点</span>':''}
        </div>
        <span class="tag ${t.publishStatus==='已发布'?'tag-ok':'tag-d'}">${t.publishStatus||'待处理'}</span>
      </div>
      <div class="tc-body">
        <div class="fl"><div class="fn">城市 / 公式</div><div class="fv">${t.city||'<span class="fe">未填写</span>'} ${t.formula?'· '+t.formula:''}</div></div>
        <div class="fl"><div class="fn">图片标题</div><div class="fv">${t.imageTitle||'<span class="fe">未填写</span>'}</div></div>
        <div class="fl"><div class="fn">正文标题</div><div class="fv">${t.bodyTitle||'<span class="fe">未填写</span>'}</div></div>
        <div class="fl"><div class="fn">图片</div><div class="fv">${t.coverImg?'封面✓ · ':'<span class="fe">无封面 · </span>'}${t.imgs.length+'张配图'||'<span class="fe">无配图</span>'}</div></div>
        ${t.publishTime?`<div class="fl"><div class="fn">发布时间</div><div class="fv">${t.publishTime}</div></div>`:''}
      </div>
      <div class="tc-act">
        <button class="btn btn-o btn-sm" onclick="openTaskEdit(${i})">编辑</button>
        <button class="btn btn-o btn-sm" onclick="openTopicSel(${i})">选选题</button>
        <button class="btn btn-o btn-sm" onclick="openImgSel(${i},'cover')">封面</button>
        <button class="btn btn-o btn-sm" onclick="openImgSel(${i},'imgs')">配图</button>
        <button class="btn btn-sm" onclick="openScan(${i})" style="background:var(--aml);color:var(--am);border:none">扫描</button>
        <button class="btn btn-sm" onclick="openPublish(${i})" style="background:var(--prl);color:var(--prd);border:none">发布包</button>

    <hr><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-o" onclick="closeImageForm()">取消</button><button class="btn btn-p" onclick="saveBatch()">导入</button></div>`;

function saveBatch(){
  let text=document.getElementById('im_batch').value.trim(),lines=text.split('\n').filter(l=>l.trim()),ims=L(K.IM),c=0;
  lines.forEach(l=>{let p=l.split('|');if(p.length>=2){ims.push({id:U(),filename:(p[1]||'').trim(),filepath:(p[2]||'').trim(),city:(p[0]||'').trim(),scene:(p[3]||'').trim(),quality:'',source:'',coverSuitable:false,watermark:false,usedCount:0,lastUsed:''});c++}});
  S(K.IM,ims);closeImageForm();renderImages();alert('导入'+c+'张');syncToSvr('images')}
function deleteImage(id){if(confirm('删除？')){S(K.IM,L(K.IM).filter(i=>i.id!==id));renderImages();syncToSvr('images')}}
function closeImageForm(){document.getElementById('imageFormModal').style.display='none'}

function renderImages(){
  let ims=L(K.IM),fc=document.getElementById('ifCity')?.value||'',fs=document.getElementById('ifScene')?.value||'',fq=(document.getElementById('ifSearch')?.value||'').toLowerCase();
  if(fc)ims=ims.filter(i=>i.city===fc);if(fs)ims=ims.filter(i=>i.scene===fs);if(fq)ims=ims.filter(i=>(i.filename||'').toLowerCase().includes(fq));
  document.getElementById('imageBadge').textContent=ims.length;
  document.getElementById('imageGrid').innerHTML=ims.map(im=>`
    <div class="ic"><div class="ip">${im.filepath?`<img src="file://${im.filepath}" onerror="this.parentElement.innerHTML='📷'" loading="lazy">`:'📷'}</div>
    <div class="ii"><div class="nm">${im.filename||'(未命名)'}</div><div class="mt">${[im.city,im.scene,im.quality].filter(Boolean).join(' · ')}</div>
    <div class="mt">${im.coverSuitable?'封面 · ':''}${im.watermark?'水印 · ':''}${im.source||''}</div></div>
    <div style="padding:4px 8px 8px;display:flex;gap:4px"><button class="btn btn-o btn-xs" onclick="openImageForm('${im.id}')">编辑</button><button class="btn btn-r btn-xs" onclick="deleteImage('${im.id}')">删</button></div></div>`).join('');
  document.getElementById('imageEmpty').style.display=ims.length===0?'block':'none';
  let cities=[...new Set(L(K.IM).map(i=>i.city).filter(Boolean))],scenes=[...new Set(L(K.IM).map(i=>i.scene).filter(Boolean))];
  document.getElementById('ifCity').innerHTML='<option value="">全部城市</option>'+cities.map(c=>`<option value="${c}" ${fc===c?'selected':''}>${c}</option>`).join('');
  document.getElementById('ifScene').innerHTML='<option value="">全部场景</option>'+scenes.map(s=>`<option value="${s}" ${fs===s?'selected':''}>${s}</option>`).join('')}

function showModal(title,body,onSave,w){let m=document.createElement('div');m.className='modal-bg';m.style.display='flex';m.innerHTML=`<div class="modal" style="${w?'max-width:'+w+'px':''}"><div class="mh"><h3>${title}</h3><button class="btn btn-o btn-sm" onclick="this.closest('.modal-bg').remove()">✕</button></div><div class="mb">${body}</div></div>`;m.onclick=function(e){if(e.target===m)m.remove()};document.body.appendChild(m)}

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>{if(b.textContent.includes(tab==='tasks'?'今日任务':tab==='topics'?'选题库':'素材库'))b.classList.add('active')});
  document.querySelectorAll('[id^="tab-"]').forEach(d=>d.style.display='none');document.getElementById('tab-'+tab).style.display='block';
  if(tab==='tasks')renderTasks();if(tab==='topics')renderTopics();if(tab==='images')renderImages()}

async function syncToSvr(type){
  let data=type==='topics'?L(K.TP):L(K.IM);
  try{await fetch('/api/save-'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});document.getElementById('statusBar').textContent='已同步'}
  catch(e){document.getElementById('statusBar').textContent='同步失败(离线)'}}

async function loadFromServer(){
  let loaded=false;
  try{let r=await fetch('topics.json');let st=await r.json();S(K.TP,st);loaded=true}catch(e){}
  try{let r=await fetch('images.json');let si=await r.json();S(K.IM,si);loaded=true}catch(e){}
  if(loaded)document.getElementById('statusBar').textContent='已加载服务端数据'
    else{document.getElementById('statusBar').textContent='离线模式(本地数据)'}}
